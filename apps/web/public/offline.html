<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No connection · Lomi-Test</title>
    <!--
      Standalone on purpose: no stylesheet, no font file, no script.

      This is the page a student sees when the network is gone, so every byte it
      depends on is a byte that might not arrive. The colours are the theme's,
      written out rather than imported, and the type falls back to the system
      face rather than waiting on a woff2 that cannot load.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6fb;
        --surface: #ffffff;
        --ink: #16162b;
        --ink-2: #5b5b75;
        --brand: #5b4be0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101018;
          --surface: #191926;
          --ink: #ececf5;
          --ink-2: #a0a0bc;
          --brand: #8b7cff;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font:
          400 16px/26px system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .card {
        background: var(--surface);
        border-radius: 16px;
        padding: 24px;
        max-width: 420px;
        text-align: center;
        box-shadow:
          0 1px 2px rgb(22 22 43 / 0.05),
          0 6px 16px rgb(22 22 43 / 0.07);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 30px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--ink-2);
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        margin-top: 20px;
        padding: 0 24px;
        border-radius: 12px;
        background: var(--brand);
        color: #fff;
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>No connection</h1>
      <!--
        Says what is true and what to do, and does not blame anybody. The
        reassurance is the important half: a student who answered ten questions
        on a dropping connection needs to know those answers are not gone.
      -->
      <p>
        Lomi-Test needs a connection to fetch your questions. Nothing you have answered is lost —
        your work is saved as you go.
      </p>
      <a href="/practice">Try again</a>
    </div>
  </body>
</html>
