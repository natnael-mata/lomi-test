# Lomi-Test.
#
# Replace LOMI_HOST with the hostname, and let certbot write the TLS block:
#   sudo certbot --nginx -d LOMI_HOST
#
# Ports match deploy.env. They are deliberately not 3000/4000-with-no-thought:
# this box runs other products, and a collision presents as somebody else's
# service failing to restart.

server {
    listen 80;
    server_name LOMI_HOST;

    # Certbot replaces this with a redirect to 443 once TLS is issued. Until
    # then the site is reachable over http, which is fine for a smoke test and
    # NOT fine for a Telegram webhook or a Chapa callback — both want https.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # The API, including the Chapa webhook.
    #
    # `proxy_request_buffering off` is deliberate: the webhook signature is an
    # HMAC over the RAW body, and anything that rewrites or re-chunks the body
    # between Chapa and Nest turns every genuine webhook into a rejected one.
    # nginx does not alter bodies, but buffering them through a temp file has
    # produced exactly that failure elsewhere, so it is switched off rather than
    # left to chance.
    location /api/ {
        proxy_pass http://127.0.0.1:LOMI_API_PORT/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is Next.js.
    location / {
        proxy_pass http://127.0.0.1:LOMI_WEB_PORT;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A mock paper is 100 questions and a slow phone. The default 60s read
    # timeout is survivable but produces mystifying failures on 3G.
    proxy_read_timeout 120s;

    client_max_body_size 4m;
}
