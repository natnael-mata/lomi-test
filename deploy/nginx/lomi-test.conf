# Lomi-Test on the shared 196.190.212.158 box.
#
# A NEW FILE, never an edit to an existing site. nginx is shared here: a config
# error takes down Chaw Taxi, EIMS and Elpis along with this. Always
# `nginx -t` before reloading, and check the neighbours answer afterwards —
# not just this one.
#
# nginx on this box is 1.18, which has no `http2 on;` directive. Use the
# `listen … http2` parameter if HTTP/2 is wanted.
#
# TLS: do NOT run `certbot --nginx` here. Port 80 has a default_server that
# proxies unmatched hosts to Chaw, and certbot would rewrite a server block of
# its own choosing. Issue with webroot instead, after this file is in place:
#
#   certbot certonly --webroot -w /var/www/html -d lomi.196-190-212-158.nip.io
#
# The 443 block below is live; the certificate was issued 2026-08-10.

server {
    listen 80;
    server_name lomi.196-190-212-158.nip.io;

    # Claims the hostname so ACME reaches this site rather than the catchall.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Issued 2026-08-10 by the webroot command above.

server {
    listen 443 ssl http2;
    server_name lomi.196-190-212-158.nip.io;

    ssl_certificate     /etc/letsencrypt/live/lomi.196-190-212-158.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lomi.196-190-212-158.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The API, including the Chapa webhook.
    #
    # `proxy_request_buffering off` is deliberate: the webhook signature is an
    # HMAC over the RAW body, and anything that re-chunks the body between
    # Chapa and Nest turns every genuine webhook into a rejected one.
    location /api/ {
        proxy_pass http://127.0.0.1:4400/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A mock paper is 100 questions on a slow phone. The default 60s read
    # timeout is survivable but produces mystifying failures on 3G.
    proxy_read_timeout 120s;
    client_max_body_size 4m;
}
