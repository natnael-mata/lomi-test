name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # From T-047 the suite includes integration tests that hit real tables, so
    # CI needs a database. Pinned to 16 — the dev `embedded-postgres` bundles 18,
    # and CI should match what production will actually run, not what the dev
    # helper happens to ship.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lomi_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/lomi_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` deliberately, not `npm install`: it installs exactly what the
      # lockfile says and fails if package.json and the lock have drifted.
      - name: Install
        run: npm ci

      # Same four commands as TASK.md's baseline rule, in the same order, so a
      # green CI means the same thing as a green local run. Each is a separate
      # step so the failing one is obvious from the job summary alone.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # First-load JS is paid in full before a student can answer anything, on a
      # phone that cannot afford it (T-203). Failing here names the commit that
      # did it, rather than leaving somebody to notice the app got slow.
      - name: First-load JS budget
        run: npm run analyze

      # Schema must exist before the integration tests run. `deploy`, never
      # `migrate dev` — deploy applies only and cannot reset.
      - name: Apply migrations
        run: npm run prisma:deploy

      - name: Test
        run: npm test

      # A hand-kept progress index is wrong within a day, and a wrong index is
      # worse than none — it is what people read instead of counting.
      - name: TASK.md progress index is current
        run: node scripts/task-progress.mjs --check

      # Prettier is checked, never applied — CI must not rewrite the tree.
      - name: Format check
        run: npm run format:check
