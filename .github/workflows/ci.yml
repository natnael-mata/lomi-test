name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` deliberately, not `npm install`: it installs exactly what the
      # lockfile says and fails if package.json and the lock have drifted.
      - name: Install
        run: npm ci

      # Same four commands as TASK.md's baseline rule, in the same order, so a
      # green CI means the same thing as a green local run. Each is a separate
      # step so the failing one is obvious from the job summary alone.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Prettier is checked, never applied — CI must not rewrite the tree.
      - name: Format check
        run: npm run format:check
# NOTE: no database service yet, because nothing in the suite touches Postgres.
# From Phase 1 (T-020 onward) the tests hit real tables, and this job will need
# a `services: postgres:` container plus DATABASE_URL and `prisma migrate deploy`
# before the Test step. Adding it now would be a service nothing connects to.
